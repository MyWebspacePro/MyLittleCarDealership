# Vollständiger Produktions-Test lokal: nginx + API + DB auf Port 8080.
#   docker compose -f docker-compose.prod.yml up -d --build
#   open http://localhost:8080
# Eigene DB (mld_db_data), getrennt von der Entwicklungs-DB.
name: mylittlecardealership-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mld}
      POSTGRES_DB: ${POSTGRES_DB:-mld}
    volumes: [mld_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mld}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mld}:${POSTGRES_PASSWORD:-mld}@db:5432/${POSTGRES_DB:-mld}
      API_PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-too}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOADS_DIR: /app/uploads
    volumes: [uploads:/app/uploads]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports: ["8080:80"]

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-mld}
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U ${POSTGRES_USER:-mld} ${POSTGRES_DB:-mld} | gzip > /backups/mld_$$(date +%Y%m%d_%H%M%S).sql.gz; find /backups -name \"*.sql.gz\" -mtime +30 -delete; sleep 86400; done"]

volumes:
  mld_db_data:
  uploads: