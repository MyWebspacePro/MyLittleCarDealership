# Lokale Entwicklung: nur Datenbank + Mailhog.
#   docker compose up -d
# Die Anwendungen laufen danach mit "npm run dev" (API :3001, Web :5173).
services:
  db:
    image: postgres:16-alpine
    container_name: mld-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mld}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mld}
      POSTGRES_DB: ${POSTGRES_DB:-mld}
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mld}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mld-mailhog
    ports: ["1025:1025", "8025:8025"]

  # Mit "docker compose --profile backup up -d" zusaetzlich starten.
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-mld}
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c", "while true; do pg_dump -h db -U ${POSTGRES_USER:-mld} ${POSTGRES_DB:-mld} | gzip > /backups/mld_$$(date +%Y%m%d_%H%M%S).sql.gz; find /backups -name \"*.sql.gz\" -mtime +30 -delete; sleep 86400; done"]

volumes:
  db_data: